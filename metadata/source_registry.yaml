repository_index: nq100
confidence_threshold: 0.90

sources:
  - index_name: Nasdaq-100
    source_name: Nasdaq Investor Relations News Releases
    source_url: https://ir.nasdaq.com/news-and-events/press-releases
    source_type: html
    parser_name: nasdaq_ir_archive
    official_source: true
    enabled: true
    discovery: true
    notes: Official Nasdaq press-release archive; discovery is title-filtered for NDX changes.
    # The archive paginates 10 releases per page -- about six weeks at Nasdaq's
    # publishing cadence. Page 0 alone is a shorter lookback than the refresh
    # interval, which is how the June 2026 quarterly rebalance and the July 2026
    # SPCX addition were both missed: by the time anyone looked, they had already
    # fallen off page 0. Nine pages is roughly a year of releases. The ?year=
    # filter 503s, so ?page=N is the only working pager.
    discovery_pages: 9
    seed_urls:
      - https://ir.nasdaq.com/news-releases/news-release-details/annual-changes-nasdaq-100-indexr-2
      - https://ir.nasdaq.com/news-releases/news-release-details/sandisk-corporation-join-nasdaq-100-indexr-beginning-april-20

  - index_name: Nasdaq-100
    source_name: Nasdaq Global Indexes NDX Overview
    source_url: https://indexes.nasdaqomx.com/Index/overview/NDX
    source_type: html
    parser_name: freshness_only
    official_source: true
    enabled: false
    discovery: false
    notes: Official index overview; disabled for membership parsing because full component data may require login.
